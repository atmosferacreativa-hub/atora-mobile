appId: com.atmosferacreativa.atora
name: material-zoom
# 1.0.2: zoom de material descargado (PDF e imágenes) + controles de lectura.
onFlowComplete:
  - setAirplaneMode: disabled
---
- runFlow: common/login-estudiante.yaml
- runFlow: common/abrir-curso.yaml

# Entrar a una lección para ver la sección "Materiales".
- scrollUntilVisible:
    element: "Videos"
- tapOn: "Videos"
- extendedWaitUntil:
    visible: "Video 1"
    timeout: 30000

# Materiales: PDF
- scrollUntilVisible:
    element: "Materiales"
- scrollUntilVisible:
    element: "Guía PDF"
# Los recorridos deben ser independientes del orden: si ya estaba descargado,
# borrarlo primero.
- tapOn:
    text: "Eliminar"
    optional: true
- tapOn:
    text: "Eliminar"
    optional: true
- tapOn: "Descargar"
- extendedWaitUntil:
    visible: "Disponible sin conexión"
    timeout: 60000
- tapOn: "Guía PDF"
- extendedWaitUntil:
    visible:
      id: "resource-ready"
    timeout: 60000
- assertNotVisible: "No se pudo abrir el archivo aquí."
- tapOn: "A+"
- takeScreenshot: capturas/material-zoom-01-pdf-zoom
- back

# Sin conexión: abrir el mismo PDF descargado.
- setAirplaneMode: enabled
- tapOn: "Guía PDF"
- extendedWaitUntil:
    visible:
      id: "resource-ready"
    timeout: 30000
- tapOn: "A+"
- takeScreenshot: capturas/material-zoom-02-pdf-offline-zoom
- back

# Imagen: visor fullscreen con zoom.
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: "NET:WIFI"
    timeout: 60000
- scrollUntilVisible:
    element: "Imagen de ejemplo"
- tapOn:
    text: "Eliminar"
    optional: true
- tapOn:
    text: "Eliminar"
    optional: true
- tapOn: "Descargar"
- extendedWaitUntil:
    visible: "Disponible sin conexión"
    timeout: 60000
- tapOn: "Imagen de ejemplo"
- extendedWaitUntil:
    visible:
      id: "resource-ready"
    timeout: 30000
- tapOn: "A+"
- takeScreenshot: capturas/material-zoom-03-imagen
- back

