appId: com.atmosferacreativa.atora
name: docente-calificar-409
---
- runFlow: common/login-docente.yaml
- tapOn: "Calificar"
- extendedWaitUntil:
    visible: "Estudiante E2E"
    timeout: 30000
- tapOn: "Estudiante E2E"
- extendedWaitUntil:
    visible: "Rúbrica.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "score-0"
- tapOn:
    id: "score-0"
- inputText: "9"
- assertVisible:
    id: "score-0"
# Mientras tanto, otro docente guarda la misma entrega.
- runScript: scripts/otro-docente-guarda.js
- scrollUntilVisible:
    element:
      id: "grading-save-draft"
- tapOn:
    id: "grading-save-draft"
- extendedWaitUntil:
    visible: "Otro docente calificó primero"
    timeout: 30000
- assertVisible: ".*Versión del docente dos.*"
- takeScreenshot: capturas/docente-calificar-409-01-conflicto
- tapOn:
    id: "conflict-review"
- extendedWaitUntil:
    visible: ".*Versión del docente dos.*"
    timeout: 15000
- takeScreenshot: capturas/docente-calificar-409-02-su-version
