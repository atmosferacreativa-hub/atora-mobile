appId: com.atmosferacreativa.atora
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "Ingresar a tu academia"
          timeout: 60000
- tapOn:
    id: "login-user"
- inputText: "estudiante2_e2e"
# 1.0.1: el campo con el foco se ve encima del teclado; "Siguiente" pasa a la contraseña.
- assertVisible:
    id: "login-user"
- pressKey: Enter
- inputText: "atora-e2e-2026"
- assertVisible:
    id: "login-password"
# "Listo" inicia sesión.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Cursos"
    timeout: 60000
