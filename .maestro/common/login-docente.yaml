appId: com.atmosferacreativa.atora
---
# El emulador del CI a veces tarda en cargar la app tras borrar sus datos: se reintenta el arranque.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "Ingresar a tu academia"
          timeout: 60000
- tapOn:
    id: "login-user"
- inputText: "docente_e2e"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "atora-e2e-2026"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Calificar"
    timeout: 60000
