# Pruebas de pantalla (Maestro). Corren en CI contra un WordPress temporal
# sembrado con `wp atora seed-e2e` (ver .github/workflows/e2e.yml).
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - academia-url
    - login
    - leccion
    - leccion-drive
    - programa-acceso
    - estudiante-asistente
    - tarea
    - quiz
    - certificado-pdf
    - mensajes
    - cambio-idioma
    - sin-conexion
    - docente-hoy
    - docente-estudiantes
    - docente-aviso
    - docente-sugerencia-ia
    - docente-calificar
    - docente-calificar-409
    - docente-borrador-recuperado
    - eliminar-cuenta
