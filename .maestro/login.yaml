appId: com.atmosferacreativa.atora
name: login
---
# El emulador del CI a veces tarda en cargar la app tras borrar sus datos: se reintenta el arranque.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "Ingresar a tu academia"
          timeout: 60000
- takeScreenshot: capturas/login-01-inicio
- tapOn:
    id: "login-user"
- inputText: "estudiante_e2e"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "atora-e2e-2026"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Cursos"
    timeout: 60000
- assertVisible: "Mensajes"
- takeScreenshot: capturas/login-02-hoy
