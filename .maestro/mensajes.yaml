appId: com.atmosferacreativa.atora
name: mensajes
---
- runFlow: common/login-estudiante.yaml
- tapOn: "Mensajes"
- extendedWaitUntil:
    visible: "Docente E2E.*"
    timeout: 30000
- assertVisible: "Avisos"
- takeScreenshot: capturas/mensajes-01-hilos
- tapOn: "Docente E2E.*"
- extendedWaitUntil:
    visible: "Hola, revisa la tarea de esta semana."
    timeout: 30000
- tapOn:
    id: "thread-input"
- inputText: "Recibido, gracias."
# 1.0.1: la caja de escritura queda pegada al teclado, visible.
- assertVisible:
    id: "thread-input"
- tapOn: "Enviar"
- extendedWaitUntil:
    visible: "Recibido, gracias."
    timeout: 30000
- assertNotVisible: "Pendiente · se enviará al tener conexión"
- takeScreenshot: capturas/mensajes-02-respuesta
