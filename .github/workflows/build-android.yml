name: Build Android artifacts (internal QA)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/SHA) to build'
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install deps
        run: npm ci

      - name: Prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK + AAB (release)
        working-directory: android
        run: |
          # En CI, con el heap por defecto Gradle puede quedarse sin Metaspace.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8/' gradle.properties || true
          grep -q '^org.gradle.jvmargs' gradle.properties || echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          printf '\nandroid { lint { checkReleaseBuilds = false } }\n' >> app/build.gradle
          ./gradlew assembleRelease bundleRelease --no-daemon --build-cache
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/atora-android-preview.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/atora-android.aab"

      - name: Páginas de 16 KB (Google Play)
        run: |
          set -euo pipefail
          ZIPALIGN=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          echo "zipalign: $ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 dist/atora-android-preview.apk > dist/zipalign-16kb.txt 2>&1 && echo "zipalign -P 16: OK" | tee -a dist/16kb-report.txt || { echo "zipalign -P 16: FAIL" | tee -a dist/16kb-report.txt; tail -20 dist/zipalign-16kb.txt; exit 1; }
          python3 scripts/check-16kb.py dist/atora-android-preview.apk dist/atora-android.aab | tee -a dist/16kb-report.txt
          {
            echo "### Páginas de 16 KB"
            echo '```'
            cat dist/16kb-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark artifacts as internal QA
        run: |
          echo "INTERNAL QA ONLY. Production signing, certificate identity and store acceptance have not been verified by this workflow." > dist/INTERNAL-QA-ONLY.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-internal-qa-${{ github.run_id }}
          path: dist/
          if-no-files-found: error

